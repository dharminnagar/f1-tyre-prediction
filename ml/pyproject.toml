[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "boxbox"
version = "0.1.0"
description = "F1 tyre degradation, remaining competitive life and pit-window estimation"
requires-python = ">=3.12"
dependencies = [
  "fastf1>=3.6,<4",
  "pandas>=2.2,<3",
  "numpy>=2",
  "scikit-learn>=1.6",
  "pyarrow>=17",
  "joblib",
  "pydantic>=2.9",
  "pyyaml",
  "typer>=0.12",
  "matplotlib>=3.9",
  "python-dotenv>=1.0",
  "requests>=2.31",
  "torch==2.8.0",
]

[project.optional-dependencies]
kaggle = ["kaggle>=1.7"]
notebooks = ["jupyterlab", "nbconvert", "nbformat", "ipykernel"]

[project.scripts]
boxbox = "boxbox.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
boxbox = ["py.typed"]
